name: Extract inline images to files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract images from index.html
        run: |
          echo '' | base64 -d > /tmp/extract.py
          python3 /tmp/extract.py
      - name: Commit image files
        run: |
          git config user.name "jordanjohnsson1-cmd"
          git config user.email "265671602+jordanjohnsson1-cmd@users.noreply.github.com"
          git add img/headshot.jpg img/greene-scholars-logo.jpg
          git commit -m "Add headshot and Greene Scholars logo image files"
          git push
